name: Bug report
description: Report a reproducible problem in the workspace, scripts, skills, or local app.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private product data, credentials, or non-redistributable source material.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest safe sequence, command, or generic workspace structure that reproduces the issue.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node version, and agent harness if relevant.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Validation output
      description: Paste relevant output from npm run validate or npm run check.
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe report
      options:
        - label: I removed credentials, private product data, account information, and non-redistributable media.
          required: true
